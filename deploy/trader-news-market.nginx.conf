# Include inside the tradernews.fyi HTTPS server block.
# Keep public market traffic out of the Arc application entirely.
keepalive_timeout 15s;
location ~ ^/market-(feed|quotes)$ {
    gzip on;
    gzip_types application/json;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    proxy_pass http://127.0.0.1:8766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Accept-Encoding "";
    proxy_cache trader_news_market;
    proxy_cache_key "$uri$is_args$args";
    proxy_cache_valid 200 120s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_lock_age 10s;
    proxy_cache_revalidate on;
    proxy_cache_background_update on;
    proxy_cache_use_stale updating;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    add_header X-Market-Cache $upstream_cache_status always;
}

# Monitoring must always see current collector health, not a cached success.
location = /market-feed-health {
    proxy_pass http://127.0.0.1:8766;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_cache off;
    add_header X-Market-Cache BYPASS always;
}
